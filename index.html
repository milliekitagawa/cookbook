<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Recipe Index</title>
<style>
:root{--paper:#f7f6f2;--ink:#171717;--muted:#666;--rule:#c9c8c1;--soft:#ecebe5}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Andale Mono,AndaleMono,Consolas,monospace;font-size:13px}button,select{font:inherit;color:inherit}button{cursor:pointer}.page{max-width:1180px;margin:0 auto;padding:28px 32px 48px}header{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--ink);padding-bottom:18px;margin-bottom:34px}h1,h2,h3,p{margin:0;font-weight:normal}h1{font-size:15px;letter-spacing:.08em}.index{color:var(--muted);font-size:11px}.preferences{border:1px solid var(--ink);display:grid;grid-template-columns:1fr 1.25fr 1.35fr auto;align-items:stretch;margin-bottom:56px}.filter{min-width:0;border-right:1px solid var(--rule);padding:14px 16px 16px}.filter label{display:block;font-size:10px;color:var(--muted);letter-spacing:.08em;margin-bottom:10px;text-transform:uppercase}select{appearance:none;border:0;outline:0;width:100%;background:transparent;padding:0 18px 0 0;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 7px) 54%,calc(100% - 3px) 54%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}.generate{border:0;background:var(--ink);color:var(--paper);padding:0 27px;letter-spacing:.07em;font-size:12px;transition:.15s}.generate:hover{background:#555}.section-label{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:13px}.section-label:after{content:"";height:1px;background:var(--rule);flex:1}.workspace{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:stretch;min-height:555px}.arrow{border:0;background:transparent;font-size:24px;color:var(--ink)}.arrow:hover{background:var(--soft)}.recipe-card{border:1px solid var(--ink);background:var(--paper);display:grid;grid-template-rows:auto minmax(0,1fr);min-height:555px;cursor:pointer}.card-head{display:grid;grid-template-columns:1fr auto;border-bottom:1px solid var(--ink)}.title-block{padding:26px 28px 21px}.recipe-number{font-size:10px;color:var(--muted);margin-bottom:18px}.recipe-title{font-size:27px;letter-spacing:-.045em;line-height:1.12}.save{min-width:128px;border:0;border-left:1px solid var(--ink);background:transparent;font-size:11px;letter-spacing:.06em;align-self:stretch}.save:hover,.save.saved{background:var(--ink);color:var(--paper)}.card-body{min-height:0;overflow:auto;padding:23px 28px 30px;scrollbar-color:var(--rule) transparent}.meta{display:flex;gap:0;border-bottom:1px solid var(--rule);padding-bottom:18px;margin-bottom:26px}.meta>div{padding-right:28px;margin-right:28px;border-right:1px solid var(--rule)}.meta>div:last-child{border:0;margin:0;padding:0}.meta dt{color:var(--muted);font-size:10px;text-transform:uppercase;margin-bottom:7px}.meta dd{margin:0;font-size:12px}.content{display:grid;grid-template-columns:minmax(150px,.8fr) 1.8fr;gap:45px}.content h3{font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:13px}.ingredients ul{padding:0;margin:0;list-style:none;line-height:1.75}.ingredients li{border-bottom:1px solid #e2e1dc;padding:2px 0}.instructions ol{margin:0;padding-left:19px;line-height:1.66}.instructions li{padding-left:7px;margin-bottom:14px}.hint{margin-top:30px;padding-top:14px;border-top:1px solid var(--rule);color:var(--muted);font-size:10px;letter-spacing:.05em}.empty{grid-column:2;border:1px solid var(--ink);display:grid;place-items:center;text-align:center;min-height:260px;padding:30px}.empty h2{font-size:15px;margin-bottom:11px}.empty p{color:var(--muted);font-size:11px}dialog{border:0;padding:0;width:100vw;height:100vh;max-width:none;max-height:none;background:var(--paper);color:var(--ink);font-family:inherit}.expanded{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}.expanded-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--ink);padding:19px 32px}.expanded-top p{font-size:11px;color:var(--muted)}.close{border:1px solid var(--ink);background:transparent;width:30px;height:30px;line-height:20px;font-size:21px}.close:hover{background:var(--ink);color:var(--paper)}.expanded-main{width:min(960px,100%);margin:0 auto;padding:40px 32px;overflow:auto}.expanded-grid{display:grid;grid-template-columns:1fr 150px;gap:35px;border-bottom:1px solid var(--ink);padding-bottom:27px;margin-bottom:30px}.expanded-title{font-size:42px;letter-spacing:-.06em;line-height:1.05}.expanded-save{border:1px solid var(--ink);background:transparent;height:43px;letter-spacing:.07em;font-size:11px}.expanded-save:hover,.expanded-save.saved{background:var(--ink);color:var(--paper)}.expanded-content{display:grid;grid-template-columns:minmax(180px,.85fr) 2fr;gap:64px}.expanded-content h3{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em;margin-bottom:16px}.expanded-content ul{padding:0;list-style:none;line-height:1.9;margin:0}.expanded-content li{border-bottom:1px solid #deddd7}.expanded-content ol{padding-left:20px;margin:0;line-height:1.8}.expanded-content ol li{margin-bottom:18px;padding-left:10px}.dialog-meta{font-size:11px;color:var(--muted);line-height:1.8}@media(max-width:720px){.page{padding:20px 16px 32px}header{margin-bottom:24px}.preferences{grid-template-columns:1fr 1fr}.filter{padding:12px;border-bottom:1px solid var(--rule)}.filter:nth-child(2){border-right:0}.filter:nth-child(3){border-bottom:0}.generate{min-height:54px}.workspace{grid-template-columns:36px minmax(0,1fr) 36px;min-height:600px}.recipe-card{min-height:600px}.title-block{padding:21px 17px 17px}.recipe-title{font-size:23px}.save{min-width:92px;font-size:10px}.card-body{padding:18px 17px 25px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:17px}.meta>div{border:0;margin:0;padding:0}.content,.expanded-content{grid-template-columns:1fr;gap:28px}.content{gap:26px}.hint{display:none}.expanded-top{padding:16px}.expanded-main{padding:30px 20px}.expanded-grid{grid-template-columns:1fr;gap:24px}.expanded-title{font-size:33px}.expanded-save{width:150px}.empty{grid-column:2;padding:20px}.section-label{margin-bottom:9px}}
</style><style>
header h1{display:flex;align-items:center;gap:9px}header h1:before{content:"";width:7px;height:7px;border:1px solid var(--ink);border-radius:50%;display:inline-block;box-shadow:8px 8px 0 -3px var(--ink);transform:rotate(-40deg);margin-bottom:5px}.workspace{grid-template-columns:44px minmax(0,520px) 44px;justify-content:center;min-height:590px}.recipe-card{min-height:590px}.recipe-photo{aspect-ratio:16/7;border-bottom:1px solid var(--ink);position:relative;overflow:hidden;background:#d9d8d2}.recipe-photo:before,.recipe-photo:after{content:"";position:absolute;border:1px solid #555}.photo-1:before{width:210px;height:80px;border-radius:50%;left:50%;top:42%;transform:translate(-50%,-50%)}.photo-1:after{width:80px;height:18px;border-radius:50%;left:42%;top:36%;box-shadow:37px 9px 0 4px #777,77px -4px 0 0 #888}.photo-2:before{width:140px;height:140px;border-radius:50%;left:50%;top:48%;transform:translate(-50%,-50%);box-shadow:inset 0 0 0 20px #bab9b2}.photo-2:after{width:135px;height:28px;border-radius:50%;left:37%;top:34%;transform:rotate(24deg);box-shadow:0 35px 0 -3px #777,12px 68px 0 -3px #777}.photo-3:before{width:190px;height:105px;border-radius:50%;left:50%;top:45%;transform:translate(-50%,-50%);background:#888;border-color:#555}.photo-3:after{width:95px;height:36px;border-radius:50%;left:41%;top:34%;box-shadow:67px 25px 0 -7px #555}.photo-4:before{width:210px;height:130px;border-radius:50%;left:50%;top:49%;transform:translate(-50%,-50%);background:#82827d}.photo-4:after{width:65px;height:42px;border-radius:50%;left:42%;top:37%;box-shadow:59px 20px 0 -5px #555}.photo-5:before{width:155px;height:155px;border-radius:48% 52% 45% 55%;left:50%;top:48%;transform:translate(-50%,-50%);background:#898984}.photo-5:after{width:70px;height:30px;border-radius:50%;left:42%;top:37%;box-shadow:43px 45px 0 -5px #555}.photo-6:before{width:180px;height:100px;border-radius:50%;left:50%;top:49%;transform:translate(-50%,-50%);background:#8c8c85}.photo-6:after{width:15px;height:15px;border-radius:50%;left:40%;top:36%;box-shadow:42px 20px 0 4px #666,85px 4px 0 2px #777}.preview-content{display:grid;grid-template-columns:1fr 1fr;gap:28px}.preview-content .ingredients{max-height:170px;overflow:auto}.preview-note{font-size:11px;line-height:1.6;color:var(--muted);border-left:1px solid var(--rule);padding-left:17px}.card-progress{border-top:1px solid var(--rule);margin-top:24px;padding-top:12px;display:flex;justify-content:space-between;color:var(--muted);font-size:10px;letter-spacing:.07em}.status{height:14px;text-align:center;color:var(--muted);font-size:10px;letter-spacing:.08em;margin:-43px 0 29px;opacity:0;transition:opacity .25s}.status.show{opacity:1}.recipe-card.regenerated{outline:1px solid var(--ink);outline-offset:4px}.saved-section{margin-top:65px}.saved-section .section-label{margin-bottom:13px}.saved-list{border-top:1px solid var(--ink)}.saved-item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--rule);padding:14px 0}.saved-item p{font-size:11px;color:var(--muted);margin-top:4px}.saved-item button{border:0;background:transparent;padding:3px 0;font-size:10px;letter-spacing:.07em;text-decoration:underline;text-underline-offset:3px}.saved-empty{padding:20px 0;color:var(--muted);font-size:11px;border-bottom:1px solid var(--rule)}@media(max-width:720px){.workspace{grid-template-columns:30px minmax(0,1fr) 30px;min-height:560px}.recipe-card{min-height:560px}.recipe-photo{aspect-ratio:16/8}.preview-content{grid-template-columns:1fr;gap:21px}.preview-note{border-left:0;border-top:1px solid var(--rule);padding:13px 0 0}.status{margin:-43px 0 29px}.saved-section{margin-top:45px}}
</style></head><body><main class="page"><header><h1>RECIPE INDEX</h1><p class="index">A SMALL GENERATOR FOR DAILY COOKING</p></header><section class="preferences" aria-label="Recipe preferences"><div class="filter"><label for="difficulty">Difficulty</label><select id="difficulty"><option value="all">Any difficulty</option><option>Easy</option><option>Medium</option><option>Hard</option></select></div><div class="filter"><label for="time">Cooking time</label><select id="time"><option value="all">Any cooking time</option><option value="under15">Under 15 min</option><option value="15to30">15–30 min</option><option value="30to60">30–60 min</option><option value="over60">60+ min</option></select></div><div class="filter"><label for="diet">Dietary preference</label><select id="diet"><option value="all">No preference</option><option>Vegetarian</option><option>Vegan</option><option>Gluten-free</option></select></div><button id="generate" class="generate">GENERATE</button></section><p id="status" class="status" role="status"></p><div class="section-label">CURRENT SELECTION</div><section id="workspace" class="workspace" aria-live="polite"></section><section class="saved-section"><div class="section-label">SAVED RECIPES</div><div id="saved-list" class="saved-list"></div></section></main><dialog id="expanded"><div class="expanded"><div class="expanded-top"><p>RECIPE INDEX / FULL RECIPE</p><button class="close" id="close" aria-label="Close expanded recipe">×</button></div><section class="expanded-main" id="expanded-main"></section></div></dialog>
<script>
const recipes=[
{id:1,name:'Lemon butter beans',difficulty:'Easy',time:18,tags:['Vegetarian','Gluten-free'],ingredients:['2 cans butter beans, drained','1 lemon, zest and juice','2 cloves garlic, thinly sliced','3 tbsp olive oil','2 handfuls spinach','parmesan, to finish'],steps:['Warm the olive oil in a wide pan. Add garlic and cook until fragrant, about one minute.','Add butter beans, lemon zest, and a pinch of salt. Cook until the beans are heated through.','Fold in spinach until just wilted. Finish with lemon juice, black pepper, and parmesan.'],note:'Good with toast or a soft-boiled egg.'},
{id:2,name:'Sesame soba with greens',difficulty:'Easy',time:14,tags:['Vegan'],ingredients:['7 oz buckwheat soba','2 tbsp tahini','1 tbsp soy sauce','1 tsp toasted sesame oil','1 lime','2 cups shredded greens','sesame seeds'],steps:['Cook soba according to packet directions. Drain and rinse under cool water.','Whisk tahini, soy sauce, sesame oil, lime juice, and two tablespoons of water until smooth.','Toss noodles with dressing and greens. Scatter with sesame seeds before serving.'],note:'Use tamari for a gluten-free bowl.'},
{id:3,name:'Mushroom polenta',difficulty:'Medium',time:42,tags:['Vegetarian','Gluten-free'],ingredients:['1 cup quick-cook polenta','4 cups vegetable stock','10 oz mixed mushrooms','1 shallot, diced','2 tbsp butter','thyme leaves','parmesan, to finish'],steps:['Bring stock to a simmer. Gradually whisk in polenta and cook until creamy, stirring often.','Meanwhile, sauté shallot and mushrooms in butter over high heat until deeply golden. Add thyme and season.','Spoon polenta into shallow bowls and top with the mushrooms and parmesan.'],note:'A calm, slow dinner for two.'},
{id:4,name:'Roasted cauliflower tacos',difficulty:'Medium',time:35,tags:['Vegan','Gluten-free'],ingredients:['1 small cauliflower, in florets','1 tbsp smoked paprika','8 corn tortillas','1 avocado','1 lime','1 cup shredded red cabbage','hot sauce'],steps:['Heat oven to 425°F / 220°C. Toss cauliflower with oil, paprika, and salt; roast for 25 minutes.','Warm tortillas in a dry pan. Mash avocado with lime juice and a pinch of salt.','Build each taco with avocado, cabbage, roasted cauliflower, and hot sauce.'],note:'Add pickled onions if you have them.'},
{id:5,name:'Herb roast squash',difficulty:'Hard',time:70,tags:['Vegetarian','Gluten-free'],ingredients:['1 large winter squash','1 cup farro','½ cup ricotta','sage leaves','1 lemon','vegetable stock','olive oil'],steps:['Heat oven to 400°F / 200°C. Halve and seed squash, oil it well, and roast cut-side down for 45–55 minutes.','Simmer farro in stock until tender. Stir through chopped sage, lemon zest, and olive oil.','Fill warm squash halves with farro. Spoon ricotta over top and return to oven for 8 minutes.'],note:'A project recipe with excellent leftovers.'},
{id:6,name:'Crisp chickpea salad',difficulty:'Easy',time:24,tags:['Vegan','Gluten-free'],ingredients:['1 can chickpeas, drained','1 cucumber, chopped','1 cup cherry tomatoes','1 small red onion','½ bunch parsley','1 lemon','olive oil'],steps:['Pan-fry chickpeas in olive oil until crisp and lightly browned. Season generously.','Combine cucumber, tomatoes, onion, and parsley in a bowl.','Toss with lemon juice and olive oil. Fold through warm chickpeas just before serving.'],note:'Keep the chickpeas separate for packed lunches.'}];
let matches=[...recipes],current=0;const saved=new Set(JSON.parse(localStorage.getItem('recipe-index-saved')||'[]'));const $=s=>document.querySelector(s);const timeMatch=(r,v)=>v==='all'||(v==='under15'&&r.time<15)||(v==='15to30'&&r.time>=15&&r.time<=30)||(v==='30to60'&&r.time>30&&r.time<=60)||(v==='over60'&&r.time>60);
function cardHTML(r){const s=saved.has(r.id);return `<button class="arrow" id="prev" aria-label="Previous recipe">←</button><article class="recipe-card" id="card" tabindex="0"><div class="card-head"><div class="title-block"><h2 class="recipe-title">${r.name}</h2></div><button class="save ${s?'saved':''}" data-save="${r.id}">${s?'SAVED':'SAVE'}</button></div><div class="card-body"><div class="recipe-photo photo-${r.id}" role="img" aria-label="Minimal food still life for ${r.name}"></div><dl class="meta"><div><dt>Difficulty</dt><dd>${r.difficulty}</dd></div><div><dt>Cooking time</dt><dd>${r.time} min</dd></div><div><dt>Ingredients</dt><dd>${r.ingredients.length} items</dd></div></dl><div class="preview-content"><section class="ingredients"><h3>Ingredients</h3><ul>${r.ingredients.map(i=>`<li>${i}</li>`).join('')}</ul></section><p class="preview-note">${r.note}<br><br>Open the card for the complete method.</p></div><div class="card-progress"><span>${current+1} / ${matches.length}</span><span>FULL RECIPE →</span></div></div></article><button class="arrow" id="next" aria-label="Next recipe">→</button>`}
function renderSaved(){const list=$('#saved-list'),items=recipes.filter(r=>saved.has(r.id));list.innerHTML=items.length?items.map(r=>`<article class="saved-item"><div><h3>${r.name}</h3><p>${r.difficulty} · ${r.time} min</p></div><button data-unsave="${r.id}">UNSAVE</button></article>`).join(''):'<p class="saved-empty">No saved recipes yet.</p>';list.querySelectorAll('[data-unsave]').forEach(b=>b.onclick=()=>toggleSave(+b.dataset.unsave))}
function render(regenerated=false){const area=$('#workspace');renderSaved();if(!matches.length){area.innerHTML='<div class="empty"><div><h2>NO RECIPES MATCH THESE PREFERENCES.</h2><p>Adjust one or more fields and generate again.</p></div></div>';return}const r=matches[current];area.innerHTML=cardHTML(r);if(regenerated){const card=$('#card');card.classList.add('regenerated');setTimeout(()=>card.classList.remove('regenerated'),450)}$('#prev').onclick=()=>{current=(current-1+matches.length)%matches.length;render()};$('#next').onclick=()=>{current=(current+1)%matches.length;render()};area.querySelector('[data-save]').onclick=e=>{e.stopPropagation();toggleSave(r.id)};$('#card').onclick=()=>openExpanded(r);$('#card').onkeydown=e=>{if(e.key==='Enter')openExpanded(r)}}
function toggleSave(id){saved.has(id)?saved.delete(id):saved.add(id);localStorage.setItem('recipe-index-saved',JSON.stringify([...saved]));render();if($('#expanded').open)renderExpanded(recipes.find(r=>r.id===id))}function renderExpanded(r){const s=saved.has(r.id);$('#expanded-main').innerHTML=`<div class="expanded-grid"><div><h2 class="expanded-title">${r.name}</h2><p class="dialog-meta">${r.difficulty.toUpperCase()} &nbsp; / &nbsp; ${r.time} MIN &nbsp; / &nbsp; ${r.tags.join(' · ').toUpperCase()}</p></div><button class="expanded-save ${s?'saved':''}" id="expanded-save">${s?'SAVED':'SAVE RECIPE'}</button></div><div class="expanded-content"><section><h3>Ingredients</h3><ul>${r.ingredients.map(i=>`<li>${i}</li>`).join('')}</ul></section><section><h3>Instructions</h3><ol>${r.steps.map(s=>`<li>${s}</li>`).join('')}</ol><p class="hint">NOTE / ${r.note}</p></section></div>`;$('#expanded-save').onclick=()=>toggleSave(r.id)}function openExpanded(r){renderExpanded(r);$('#expanded').showModal()}$('#close').onclick=()=>$('#expanded').close();$('#expanded').addEventListener('click',e=>{if(e.target===$('#expanded'))$('#expanded').close()});$('#generate').onclick=()=>{const d=$('#difficulty').value,t=$('#time').value,di=$('#diet').value;matches=recipes.filter(r=>(d==='all'||r.difficulty===d)&&timeMatch(r,t)&&(di==='all'||r.tags.includes(di)));current=matches.length?Math.floor(Math.random()*matches.length):0;const status=$('#status');status.textContent=matches.length?'RECIPE GENERATED':'NO MATCH FOUND';status.classList.add('show');setTimeout(()=>status.classList.remove('show'),1600);render(true)};render();
</script></body></html>
