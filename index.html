margin-bottom:14px}.meta>div{padding:0;margin:0}.preview-content .ingredients ul{column-count:1}.progress-wrap{margin-top:10px}}
</style></head><body><main class="page"><header><h1>RECIPE INDEX</h1><p class="index">A SMALL GENERATOR FOR DAILY COOKING</p></header><section class="preferences" aria-label="Recipe preferences"><div class="filter"><label for="difficulty">Difficulty</label><select id="difficulty"><option value="all">Any difficulty</option><option>Easy</option><option>Medium</option><option>Hard</option></select></div><div class="filter"><label for="time">Cooking time</label><select id="time"><option value="all">Any cooking time</option><option value="under15">Under 15 min</option><option value="15to30">15–30 min</option><option value="30to60">30–60 min</option><option value="over60">60+ min</option></select></div><div class="filter"><label for="diet">Dietary preference</label><select id="diet"><option value="all">No preference</option><option>Vegetarian</option><option>Vegan</option><option>Gluten-free</option></select></div><button id="generate" class="generate">GENERATE</button></section><p id="status" class="status" role="status"></p><div class="section-label">CURRENT SELECTION</div><section id="workspace" class="workspace" aria-live="polite"></section><section class="saved-section"><div class="section-label">SAVED RECIPES</div><div id="saved-list" class="saved-list"></div></section></main><dialog id="expanded"><div class="expanded"><div class="expanded-top"><p>RECIPE INDEX / FULL RECIPE</p><button class="close" id="close" aria-label="Close expanded recipe">×</button></div><section class="expanded-main" id="expanded-main"></section></div></dialog>
<script>
const photoStyle=document.createElement('style');photoStyle.textContent='.recipe-photo{background:#d7d6d0;position:relative;overflow:hidden}.recipe-photo:before,.recipe-photo:after{content:"";position:absolute;border:1px solid #52524e}.photo-1:before{width:210px;height:78px;border-radius:50%;left:50%;top:48%;transform:translate(-50%,-50%)}.photo-1:after{width:84px;height:17px;border-radius:50%;left:39%;top:35%;box-shadow:40px 10px 0 4px #73736e,82px -2px 0 0 #858580}.photo-2:before{width:135px;height:135px;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:inset 0 0 0 19px #b6b5af}.photo-2:after{width:130px;height:27px;border-radius:50%;left:37%;top:34%;transform:rotate(23deg);box-shadow:0 36px 0 -3px #777,12px 68px 0 -3px #777}.photo-3:before{width:190px;height:100px;border-radius:50%;left:50%;top:49%;transform:translate(-50%,-50%);background:#888782}.photo-3:after{width:90px;height:34px;border-radius:50%;left:41%;top:34%;box-shadow:67px 25px 0 -7px #575752}.photo-4:before{width:205px;height:125px;border-radius:50%;left:50%;top:49%;transform:translate(-50%,-50%);background:#85857f}.photo-4:after{width:62px;height:40px;border-radius:50%;left:42%;top:37%;box-shadow:59px 19px 0 -5px #575752}.photo-5:before{width:150px;height:150px;border-radius:48% 52% 45% 55%;left:50%;top:48%;transform:translate(-50%,-50%);background:#85857f}.photo-5:after{width:68px;height:28px;border-radius:50%;left:42%;top:37%;box-shadow:43px 45px 0 -5px #555}.photo-6:before{width:180px;height:98px;border-radius:50%;left:50%;top:49%;transform:translate(-50%,-50%);background:#888782}.photo-6:after{width:14px;height:14px;border-radius:50%;left:40%;top:36%;box-shadow:42px 20px 0 4px #666,85px 4px 0 2px #777}';document.head.append(photoStyle);const recipes=[
{id:1,name:'Lemon butter beans',difficulty:'Easy',time:18,tags:['Vegetarian','Gluten-free'],ingredients:['2 cans butter beans, drained','1 lemon, zest and juice','2 cloves garlic, thinly sliced','3 tbsp olive oil','2 handfuls spinach','parmesan, to finish'],steps:['Warm the olive oil in a wide pan. Add garlic and cook until fragrant, about one minute.','Add butter beans, lemon zest, and a pinch of salt. Cook until the beans are heated through.','Fold in spinach until just wilted. Finish with lemon juice, black pepper, and parmesan.'],note:'Good with toast or a soft-boiled egg.'},
{id:2,name:'Sesame soba with greens',difficulty:'Easy',time:14,tags:['Vegan'],ingredients:['7 oz buckwheat soba','2 tbsp tahini','1 tbsp soy sauce','1 tsp toasted sesame oil','1 lime','2 cups shredded greens','sesame seeds'],steps:['Cook soba according to packet directions. Drain and rinse under cool water.','Whisk tahini, soy sauce, sesame oil, lime juice, and two tablespoons of water until smooth.','Toss noodles with dressing and greens. Scatter with sesame seeds before serving.'],note:'Use tamari for a gluten-free bowl.'},
{id:3,name:'Mushroom polenta',difficulty:'Medium',time:42,tags:['Vegetarian','Gluten-free'],ingredients:['1 cup quick-cook polenta','4 cups vegetable stock','10 oz mixed mushrooms','1 shallot, diced','2 tbsp butter','thyme leaves','parmesan, to finish'],steps:['Bring stock to a simmer. Gradually whisk in polenta and cook until creamy, stirring often.','Meanwhile, sauté shallot and mushrooms in butter over high heat until deeply golden. Add thyme and season.','Spoon polenta into shallow bowls and top with the mushrooms and parmesan.'],note:'A calm, slow dinner for two.'},
{id:4,name:'Roasted cauliflower tacos',difficulty:'Medium',time:35,tags:['Vegan','Gluten-free'],ingredients:['1 small cauliflower, in florets','1 tbsp smoked paprika','8 corn tortillas','1 avocado','1 lime','1 cup shredded red cabbage','hot sauce'],steps:['Heat oven to 425°F / 220°C. Toss cauliflower with oil, paprika, and salt; roast for 25 minutes.','Warm tortillas in a dry pan. Mash avocado with lime juice and a pinch of salt.','Build each taco with avocado, cabbage, roasted cauliflower, and hot sauce.'],note:'Add pickled onions if you have them.'},
{id:5,name:'Herb roast squash',difficulty:'Hard',time:70,tags:['Vegetarian','Gluten-free'],ingredients:['1 large winter squash','1 cup farro','½ cup ricotta','sage leaves','1 lemon','vegetable stock','olive oil'],steps:['Heat oven to 400°F / 200°C. Halve and seed squash, oil it well, and roast cut-side down for 45–55 minutes.','Simmer farro in stock until tender. Stir through chopped sage, lemon zest, and olive oil.','Fill warm squash halves with farro. Spoon ricotta over top and return to oven for 8 minutes.'],note:'A project recipe with excellent leftovers.'},
{id:6,name:'Crisp chickpea salad',difficulty:'Easy',time:24,tags:['Vegan','Gluten-free'],ingredients:['1 can chickpeas, drained','1 cucumber, chopped','1 cup cherry tomatoes','1 small red onion','½ bunch parsley','1 lemon','olive oil'],steps:['Pan-fry chickpeas in olive oil until crisp and lightly browned. Season generously.','Combine cucumber, tomatoes, onion, and parsley in a bowl.','Toss with lemon juice and olive oil. Fold through warm chickpeas just before serving.'],note:'Keep the chickpeas separate for packed lunches.'},
{id:7,name:'Miso ginger ramen',difficulty:'Easy',time:28,tags:['Vegan'],image:'miso-ramen',description:'A quick broth of miso and ginger turns everyday noodles into a deeply savoury bowl. Crisp vegetables and sesame add contrast without weighing it down.',ingredients:['2 packs ramen noodles','2 tbsp white miso','1 tbsp grated ginger','4 cups vegetable stock','1 cup mushrooms','1 cup bok choy','sesame seeds'],steps:['Bring stock, miso, and ginger to a gentle simmer, whisking until the miso dissolves.','Cook noodles in a separate pot until just tender.','Divide noodles between bowls and pour over broth, mushrooms, and bok choy. Finish with sesame seeds.'],note:'Add chili oil at the table.'},
{id:8,name:'Spanish tortilla with herbs',difficulty:'Medium',time:48,tags:['Vegetarian','Gluten-free'],image:'spanish-tortilla',description:'Soft potatoes and eggs make a substantial Spanish-style skillet tortilla. Fresh herbs at the finish keep the rich interior tasting bright.',ingredients:['5 eggs','1 lb waxy potatoes','1 small onion','½ cup olive oil','parsley','chives','sea salt'],steps:['Slice potatoes and onion thinly, then cook slowly in olive oil until completely tender.','Drain vegetables and mix with beaten eggs and herbs.','Cook in a nonstick skillet until set, then carefully flip and finish the second side.'],note:'Serve warm or at room temperature.'},
{id:9,name:'Coconut lentil dal',difficulty:'Easy',time:32,tags:['Vegan','Gluten-free'],image:'coconut-dal',description:'Red lentils simmer into a creamy spiced dal with coconut milk and tomato. A quick cumin tempering gives it a fragrant, restaurant-style finish.',ingredients:['1 cup red lentils','1 can coconut milk','1 cup crushed tomatoes','1 tbsp curry powder','1 tsp cumin seeds','1 onion','cilantro'],steps:['Rinse lentils and simmer with coconut milk, tomatoes, curry powder, and water until soft.','Season with salt and adjust the consistency with more water if needed.','Bloom cumin seeds in hot oil and pour over the dal. Finish with cilantro.'],note:'Excellent with rice or flatbread.'},
{id:10,name:'Sheet-pan harissa chicken',difficulty:'Easy',time:42,tags:['Gluten-free'],image:'harissa-chicken',description:'Chicken roasts beside carrots and chickpeas in a smoky harissa coating. The high heat creates crisp edges while the vegetables absorb the pan juices.',ingredients:['4 chicken thighs','2 tbsp harissa','3 carrots','1 can chickpeas','1 lemon','olive oil','mint'],steps:['Heat oven to 425°F / 220°C and toss carrots and chickpeas with oil and salt.','Coat chicken with harissa and arrange everything on a sheet pan.','Roast until the chicken is browned and cooked through, then finish with lemon and mint.'],note:'A full dinner from one pan.'},
{id:11,name:'Mushroom risotto',difficulty:'Hard',time:55,tags:['Vegetarian','Gluten-free'],image:'mushroom-risotto',description:'Arborio rice is slowly stirred into a glossy risotto with roasted mushrooms and stock. Its careful method rewards you with a silky, deeply savoury bowl.',ingredients:['1½ cups arborio rice','8 oz mushrooms','5 cups vegetable stock','1 shallot','½ cup white wine','butter','parmesan'],steps:['Roast mushrooms until browned and keep warm.','Cook shallot in butter, toast the rice, then add wine and let it absorb.','Add hot stock a ladle at a time, stirring often, until the rice is tender. Fold in mushrooms and parmesan.'],note:'Stir gently, not constantly.'},
{id:12,name:'Black bean breakfast tostadas',difficulty:'Easy',time:14,tags:['Vegetarian','Gluten-free'],image:'bean-tostadas',description:'Crisp corn tostadas are layered with warm black beans, avocado, and a runny egg. Lime and salsa make the short ingredient list taste lively.',ingredients:['4 corn tostadas','1 can black beans','4 eggs','1 avocado','salsa','1 lime','cilantro'],steps:['Warm black beans with a splash of water and a pinch of salt.','Fry or poach eggs to your liking.','Spread beans over tostadas and top with egg, avocado, salsa, lime, and cilantro.'],note:'Skip the egg for a vegan variation.'},
{id:13,name:'Za’atar roasted vegetable couscous',difficulty:'Medium',time:38,tags:['Vegan'],image:'zaatar-couscous',description:'Roasted peppers, squash, and onion are folded through fluffy couscous with lemon and za’atar. The spice blend brings a floral, nutty character to the vegetables.',ingredients:['1 cup couscous','1 zucchini','1 red pepper','1 red onion','2 tbsp za’atar','1 lemon','olive oil'],steps:['Heat oven to 425°F / 220°C and roast vegetables with olive oil and za’atar until caramelized.','Pour boiling salted water over couscous, cover, and let steam for five minutes.','Fluff couscous and fold through vegetables, lemon juice, and extra olive oil.'],note:'Use quinoa for a gluten-free alternative.'},
{id:14,name:'Thai basil turkey lettuce cups',difficulty:'Medium',time:26,tags:['Gluten-free'],image:'thai-lettuce-cups',description:'Savory turkey is quickly stir-fried with basil, lime, and chili. Cool lettuce leaves turn it into a crisp, hands-on meal with plenty of contrast.',ingredients:['1 lb ground turkey','2 cloves garlic','1 tbsp fish sauce','1 lime','1 cup basil','butter lettuce','chili flakes'],steps:['Brown turkey in a hot skillet, breaking it into small pieces.','Add garlic, fish sauce, chili, and lime juice; cook until glossy.','Stir through basil just before serving and spoon into lettuce leaves.'],note:'Serve with rice if you want a fuller meal.'},
{id:15,name:'Baked feta orzo',difficulty:'Easy',time:30,tags:['Vegetarian'],image:'baked-feta-orzo',description:'Tomatoes and feta bake into a tangy sauce that coats tender orzo. Spinach stirred in at the end gives the dish a soft, fresh finish.',ingredients:['1 block feta','2 cups cherry tomatoes','1 cup orzo','2 cups vegetable stock','2 handfuls spinach','garlic','olive oil'],steps:['Bake feta, tomatoes, garlic, and olive oil at 400°F / 200°C until jammy.','Stir in orzo and stock, then return to the oven until the pasta is tender.','Fold in spinach and let stand for five minutes before serving.'],note:'A comforting casserole-style pasta.'},
{id:16,name:'Slow-braised beef and olives',difficulty:'Hard',time:135,tags:['No preference','Gluten-free'],image:'braised-beef',description:'Beef slowly braises with tomatoes, orange, and green olives until fork-tender. The long cook creates a rich sauce with bright, briny notes.',ingredients:['2 lb beef chuck','1 onion','3 cloves garlic','1 can tomatoes','1 orange','¾ cup green olives','beef stock'],steps:['Brown beef deeply in a heavy pot and set aside.','Cook onion and garlic, then add tomatoes, stock, orange peel, and olives.','Return beef to the pot and braise covered at 325°F / 165°C until tender.'],note:'Best made a day ahead.'}];
const refinementStyle=document.createElement('style');refinementStyle.textContent='header h1{display:flex;align-items:center;gap:10px}header h1:before{content:"";width:13px;height:13px;border:1px solid var(--ink);border-radius:50%;display:block;box-shadow:inset 0 0 0 3px var(--paper)}header h1:after{content:"";width:15px;height:1px;background:var(--ink);display:block;margin-left:-2px}.status{position:fixed;z-index:20;top:50%;left:50%;margin:0;transform:translate(-50%,-50%);height:auto;pointer-events:none}.status.show{animation:generatedNotice 1.25s ease-out forwards}@keyframes generatedNotice{0%{opacity:0;transform:translate(-50%,-42%)}15%{opacity:1;transform:translate(-50%,-50%)}70%{opacity:1;transform:translate(-50%,-64%)}100%{opacity:0;transform:translate(-50%,-86%)}}.saved-item button{margin-left:auto}.meta>div:nth-child(1){order:3}.meta>div:nth-child(2){order:2}.meta>div:nth-child(3){order:1}';document.head.append(refinementStyle);let matches=[...recipes],current=0;const saved=new Set(JSON.parse(localStorage.getItem('recipe-index-saved')||'[]'));const $=s=>document.querySelector(s);const timeMatch=(r,v)=>v==='all'||(v==='under15'&&r.time<15)||(v==='15to30'&&r.time>=15&&r.time<=30)||(v==='30to60'&&r.time>30&&r.time<=60)||(v==='over60'&&r.time>60);
function cardHTML(r){const s=saved.has(r.id),descriptions=r.description||{1:'A warm, lemony bean dish with wilted greens and a little parmesan. It is brightened by citrus and finished with just enough richness to feel complete.',2:'Nutty soba noodles are tossed with tender greens and a creamy sesame dressing. The lime and toasted sesame give the bowl a clean, savoury finish.',3:'Creamy polenta provides a soft base for deeply browned mushrooms and thyme. The contrast between silky cornmeal and savoury mushrooms makes this especially comforting.',4:'Smoky roasted cauliflower is tucked into warm corn tortillas with crisp cabbage and avocado. Each taco balances char, crunch, and a little heat.',5:'Roasted squash becomes a generous vessel for fragrant farro, sage, and ricotta. The lemon keeps the earthy ingredients lifted and fresh.',6:'Crisp chickpeas meet juicy tomatoes, cucumber, and parsley in a simple chopped salad. Warm spiced legumes make the cool vegetables feel more substantial.'}[r.id];return `<button class="arrow" id="prev" aria-label="Previous recipe">←</button><article class="recipe-card rebuilt-card" id="card"><header class="rebuilt-header"><div class="rebuilt-title"><h2>${r.name}</h2></div><button class="rebuilt-save ${s?'saved':''}" data-save="${r.id}">${s?'SAVED':'SAVE'}</button></header><div class="rebuilt-content"><dl class="rebuilt-meta"><div><dt>Difficulty</dt><dd>${r.difficulty}</dd></div><div><dt>Cooking time</dt><dd>${r.time} min</dd></div><div><dt>Diet</dt><dd>${r.tags.join(', ')}</dd></div></dl><p class="rebuilt-description">${descriptions}</p><section class="rebuilt-ingredients"><h3>Ingredients</h3><ul>${r.ingredients.map(i=>`<li>${i}</li>`).join('')}</ul></section><button class="rebuilt-full" id="full-recipe">FULL RECIPE →</button></div></article><button class="arrow" id="next" aria-label="Next recipe">→</button>`}
function renderSaved(){const list=$('#saved-list'),items=recipes.filter(r=>saved.has(r.id));list.innerHTML=items.length?items.map(r=>`<article class="saved-item" data-open="${r.id}"><div><h3>${r.name}</h3><p>${r.difficulty} · ${r.time} min</p></div><div class="saved-actions"><button data-unsave="${r.id}">UNSAVE</button><button class="download-recipe" data-download="${r.id}" aria-label="Download ${r.name} as a PNG" title="Download recipe as PNG"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0-4-4m4 4 4-4M4 15v5h16v-5"/></svg></button></div></article>`).join(''):'<p class="saved-empty">No saved recipes yet.</p>';list.querySelectorAll('[data-unsave]').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleSave(+b.dataset.unsave)});list.querySelectorAll('[data-download]').forEach(b=>b.onclick=e=>{e.stopPropagation();downloadRecipe(recipes.find(r=>r.id===+b.dataset.download))});list.querySelectorAll('[data-open]').forEach(item=>item.onclick=()=>openExpanded(recipes.find(r=>r.id===+item.dataset.open)))}

function downloadRecipe(r){if(!r)return;const sheetWidth=1080,pad=72,bodyWidth=sheetWidth-pad*2,ink='#181817',paper='#f7f6f1',muted='#676762',rule='#b7b6ae',measure=document.createElement('canvas').getContext('2d'),bodyFont='24px "Andale Mono", monospace',titleFont='44px "Andale Mono", monospace',smallFont='17px "Andale Mono", monospace';const wrap=(value,font,width=bodyWidth)=>{measure.font=font;const words=String(value||'').split(/\s+/).filter(Boolean),lines=[];let line='';words.forEach(word=>{const candidate=line?`${line} ${word}`:word;if(line&&measure.measureText(candidate).width>width){lines.push(line);line=word}else line=candidate});if(line)lines.push(line);return lines};const titleLines=wrap(r.name,titleFont),descriptionLines=wrap(r.description||'',bodyFont),ingredientLines=r.ingredients.flatMap(item=>wrap(`• ${item}`,bodyFont)),methodLines=r.steps.flatMap((step,i)=>wrap(`${i+1}. ${step}`,bodyFont));const blocks=[['DESCRIPTION',descriptionLines],['INGREDIENTS',ingredientLines],['METHOD',methodLines]];const headerHeight=pad+30+30+titleLines.length*55+28+48+22;const contentHeight=blocks.reduce((total,[,lines])=>total+28+18+lines.length*37+32,0);const sheetHeight=headerHeight+contentHeight+pad;const canvas=document.createElement('canvas');canvas.width=sheetWidth;canvas.height=sheetHeight;const ctx=canvas.getContext('2d');ctx.fillStyle=paper;ctx.fillRect(0,0,sheetWidth,sheetHeight);let y=pad;ctx.fillStyle=ink;ctx.font=smallFont;ctx.textAlign='center';ctx.fillText('PICK A PLATE',sheetWidth/2,y);y+=30;ctx.strokeStyle=rule;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(sheetWidth-pad,y);ctx.stroke();y+=54;ctx.textAlign='left';ctx.font=titleFont;titleLines.forEach(line=>{ctx.fillText(line,pad,y);y+=55});y+=4;ctx.font=smallFont;ctx.fillStyle=muted;ctx.fillText(`DIFFICULTY / ${r.difficulty.toUpperCase()}     TIME / ${r.time} MIN     DIET / ${r.tags.join(', ').toUpperCase()}`,pad,y);y+=28;ctx.strokeStyle=rule;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(sheetWidth-pad,y);ctx.stroke();y+=40;blocks.forEach(([label,lines])=>{ctx.fillStyle=ink;ctx.font=smallFont;ctx.fillText(label,pad,y);y+=28;ctx.font=bodyFont;lines.forEach(line=>{ctx.fillText(line,pad,y);y+=37});y+=20});ctx.strokeStyle=rule;ctx.beginPath();ctx.moveTo(pad,sheetHeight-pad+10);ctx.lineTo(sheetWidth-pad,sheetHeight-pad+10);ctx.stroke();ctx.fillStyle=muted;ctx.font=smallFont;ctx.textAlign='right';ctx.fillText('PICK A PLATE / RECIPE SHEET',sheetWidth-pad,sheetHeight-pad+38);const link=document.createElement('a');link.download=`${r.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}.png`;link.href=canvas.toDataURL('image/png');document.body.appendChild(link);link.click();link.remove()}
function render(regenerated=false){if(!window.preferenceListenerBound){document.querySelectorAll('.preferences select').forEach(select=>select.addEventListener('change',()=>$('#generate').classList.add('pending')));window.preferenceListenerBound=true}if(regenerated){current=0;$('#generate').classList.remove('pending')}const area=$('#workspace');renderSaved();let progress=$('#progress-wrap');if(!progress){progress=document.createElement('div');progress.id='progress-wrap';progress.className='progress-wrap';area.insertAdjacentElement('afterend',progress)}if(!matches.length){progress.textContent='';area.innerHTML='<div class="empty"><div><h2>NO RECIPES MATCH THESE PREFERENCES.</h2><p>Adjust one or more fields and generate again.</p></div></div>';return}const r=matches[current];area.innerHTML=cardHTML(r);progress.textContent=`${current+1} / ${matches.length}`;if(regenerated){const card=$('#card');card.classList.add('typing');setTimeout(()=>card.classList.remove('typing'),2050)}$('#prev').onclick=()=>{current=(current-1+matches.length)%matches.length;render()};$('#next').onclick=()=>{current=(current+1)%matches.length;render()};area.querySelector('[data-save]').onclick=e=>{e.stopPropagation();toggleSave(r.id)};$('#full-recipe').onclick=()=>openExpanded(r)}
const legacyDescriptions={1:'A warm, lemony bean dish with wilted greens and a little parmesan. It is brightened by citrus and finished with just enough richness to feel complete.',2:'Nutty soba noodles are tossed with tender greens and a creamy sesame dressing. The lime and toasted sesame give the bowl a clean, savoury finish.',3:'Creamy polenta provides a soft base for deeply browned mushrooms and thyme. The contrast between silky cornmeal and savoury mushrooms makes this especially comforting.',4:'Smoky roasted cauliflower is tucked into warm corn tortillas with crisp cabbage and avocado. Each taco balances char, crunch, and a little heat.',5:'Roasted squash becomes a generous vessel for fragrant farro, sage, and ricotta. The lemon keeps the earthy ingredients lifted and fresh.',6:'Crisp chickpeas meet juicy tomatoes, cucumber, and parsley in a simple chopped salad. Warm spiced legumes make the cool vegetables feel more substantial.'};recipes.forEach(r=>r.description??=legacyDescriptions[r.id]);function toggleSave(id){saved.has(id)?saved.delete(id):saved.add(id);localStorage.setItem('recipe-index-saved',JSON.stringify([...saved]));render();if($('#expanded').open)renderExpanded(recipes.find(r=>r.id===id))}function renderExpanded(r){const s=saved.has(r.id);$('#expanded-main').innerHTML=`<div class="expanded-grid"><div><h2 class="expanded-title">${r.name}</h2><p class="dialog-meta">${r.difficulty.toUpperCase()} &nbsp; / &nbsp; ${r.time} MIN &nbsp; / &nbsp; ${r.tags.join(' · ').toUpperCase()}</p></div><button class="expanded-save ${s?'saved':''}" id="expanded-save">${s?'SAVED':'SAVE RECIPE'}</button></div><div class="expanded-content"><section class="popup-description"><h3>Description</h3><p>${r.description}</p></section><section><h3>Ingredients</h3><ul>${r.ingredients.map(i=>`<li>${i}</li>`).join('')}</ul></section><section class="popup-method"><h3>Method</h3><ol>${r.steps.map(s=>`<li>${s}</li>`).join('')}</ol></section></div>`;$('#expanded-save').onclick=()=>toggleSave(r.id)}function openExpanded(r){renderExpanded(r);$('#expanded').showModal()}function showGeneratedFeedback(){window.awaitingRecipeView=false}$('#close').onclick=()=>$('#expanded').close();$('#expanded').addEventListener('click',e=>{if(e.target===$('#expanded'))$('#expanded').close()});$('#generate').onclick=()=>{const d=$('#difficulty').value,t=$('#time').value,di=$('#diet').value;matches=recipes.filter(r=>(d==='all'||r.difficulty===d)&&timeMatch(r,t)&&(di==='all'||r.tags.includes(di)));current=matches.length?Math.floor(Math.random()*matches.length):0;showGeneratedFeedback();render(true)};document.querySelector('header h1').textContent='PICK A PLATE';document.querySelector('.section-label:not(.saved-section .section-label)')?.remove();render();
